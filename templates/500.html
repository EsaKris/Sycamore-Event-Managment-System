<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Something went wrong</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0B0E14; color: #EDEFF3; font-family: 'Segoe UI', Arial, sans-serif; text-align: center;
      padding: 24px;
    }
    .code { font-size: 72px; font-weight: 700; color: #D4A24C; margin: 0; line-height: 1; }
    h1 { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
    p { color: #A6ADBB; font-size: 14px; max-width: 380px; margin: 0 auto 28px; line-height: 1.6; }
    a {
      display: inline-block; background: #D4A24C; color: #1a1305; font-weight: 600; font-size: 14px;
      text-decoration: none; border-radius: 999px; padding: 12px 28px;
    }
    a:hover { background: #E8B85E; }
  </style>
</head>
<body>
  <div>
    <p class="code">500</p>
    <h1>Something went wrong on our end</h1>
    <p>We've been notified and are looking into it. Please try again in a few minutes.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
